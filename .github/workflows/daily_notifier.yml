name: Daily Canteen Notifier (Both Groups)

on:
  schedule:
    # 13:30 UTC = 7:00 PM IST, every day including weekends
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        working-directory: github_actions
        run: pip install -r requirements.txt

      - name: Run Scraper
        env:
          VIDYALAYA_USERNAME: ${{ secrets.VIDYALAYA_USERNAME }}
          VIDYALAYA_PASSWORD: ${{ secrets.VIDYALAYA_PASSWORD }}
        run: python github_actions/scraper.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Go Dependencies
        working-directory: github_actions/wa_sender
        run: go mod download

      - name: Send WhatsApp Message (Both Groups)
        working-directory: github_actions
        env:
          PART1: ${{ secrets.WHATSAPP_SESSION_PART1 }}
          PART2: ${{ secrets.WHATSAPP_SESSION_PART2 }}
        run: |
          if [ ! -f message_to_send.txt ]; then
            echo "No message to send (holiday or no menu found). Skipping."
            exit 0
          fi
          
          # Reconstruct the session database using Python for robustness
          python -c "
          import os, base64, gzip, sys
          try:
              b = base64.b64decode(os.environ['PART1'] + os.environ['PART2'])
              with open('/tmp/whatsapp_session.db', 'wb') as f:
                  f.write(gzip.decompress(b))
          except Exception as e:
              print('Extraction Failed:', e)
              sys.exit(1)
          "
          
          # Run the custom Go WhatsApp Sender we built
          cd wa_sender
          CGO_ENABLED=1 go run main.go production
