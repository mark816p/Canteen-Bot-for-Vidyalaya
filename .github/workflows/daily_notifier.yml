name: Daily Canteen Notifier (Both Groups)

on:

  workflow_dispatch:
  repository_dispatch:
    types: [trigger-daily-notifier]

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        working-directory: github_actions
        run: pip install -r requirements.txt

      - name: Run Scraper
        env:
          VIDYALAYA_USERNAME: ${{ secrets.VIDYALAYA_USERNAME }}
          VIDYALAYA_PASSWORD: ${{ secrets.VIDYALAYA_PASSWORD }}
        run: python github_actions/scraper.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Go Dependencies
        working-directory: github_actions/wa_sender
        run: go mod tidy

      - name: Restore WhatsApp Session Cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/whatsapp_session.db
          key: whatsapp-session-${{ github.run_id }}
          restore-keys: |
            whatsapp-session-

      - name: Send WhatsApp Message (Both Groups)
        working-directory: github_actions
        env:
          PART1: ${{ secrets.WHATSAPP_SESSION_PART1 }}
          PART2: ${{ secrets.WHATSAPP_SESSION_PART2 }}
        run: |
          if [ ! -f message_to_send.txt ]; then
            echo "No message to send (holiday or no menu found). Skipping."
            exit 0
          fi
          
          # Reconstruct the session database only if not already restored from cache
          python -c "
          import os, base64, gzip, sys
          if os.path.exists('/tmp/whatsapp_session.db') and os.path.getsize('/tmp/whatsapp_session.db') > 1000:
              print('Using cached session database.')
              sys.exit(0)
          print('No cached session DB found. Reconstructing from secrets...')
          try:
              b = base64.b64decode(os.environ['PART1'] + os.environ['PART2'])
              with open('/tmp/whatsapp_session.db', 'wb') as f:
                  f.write(gzip.decompress(b))
              print('Extracted session DB successfully.')
          except Exception as e:
              print('Extraction Failed:', e)
              sys.exit(1)
          "
          
          # Run the custom Go WhatsApp Sender we built
          cd wa_sender
          CGO_ENABLED=1 go run main.go production

      - name: Save Updated WhatsApp Session Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/whatsapp_session.db
          key: whatsapp-session-${{ github.run_id }}
