name: Daily Canteen Notifier (Both Groups)

on:
  schedule:
    # 13:30 UTC = 7:00 PM IST
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        working-directory: github_actions
        run: pip install -r requirements.txt

      - name: Run Scraper
        env:
          VIDYALAYA_USERNAME: ${{ secrets.VIDYALAYA_USERNAME }}
          VIDYALAYA_PASSWORD: ${{ secrets.VIDYALAYA_PASSWORD }}
        run: python github_actions/scraper.py

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Go Dependencies
        working-directory: github_actions/wa_sender
        run: |
          go mod tidy

      - name: Send WhatsApp Message (Both Groups)
        working-directory: github_actions
        env:
          PART1: ${{ secrets.WHATSAPP_SESSION_PART1 }}
          PART2: ${{ secrets.WHATSAPP_SESSION_PART2 }}
        run: |
          if [ ! -f message_to_send.txt ]; then
            echo "No message to send (holiday or no menu found). Skipping."
            exit 0
          fi
          
          # Reconstruct the session database
          echo "$PART1$PART2" | base64 -d | gzip -d > /tmp/whatsapp_session.db
          
          # Run the custom Go WhatsApp Sender we built
          cd wa_sender
          go run main.go production
