name: Link WhatsApp via Green API

on:
  workflow_dispatch:

jobs:
  link-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Instructions to link your WhatsApp
        run: |
          echo "============================================================"
          echo "  HOW TO LINK YOUR WHATSAPP TO GREEN API (one-time setup)"
          echo "============================================================"
          echo ""
          echo "1. Go to https://console.green-api.com"
          echo "2. Sign up for a FREE Developer account"
          echo "3. Create a new instance (choose the FREE plan)"
          echo "4. In your instance dashboard, click 'Scan QR Code'"
          echo "5. Open WhatsApp on your phone > Linked Devices > Link a Device"
          echo "6. Scan the QR code shown on the Green API website"
          echo "7. Copy your idInstance and apiTokenInstance from the dashboard"
          echo "8. Go to your GitHub repo Settings > Secrets and variables > Actions"
          echo "9. Add two secrets:"
          echo "      GREEN_API_ID    = your idInstance number"
          echo "      GREEN_API_TOKEN = your apiTokenInstance"
          echo ""
          echo "That's it! Once done, run the 'Test Canteen Notifier' workflow."
          echo "============================================================"
