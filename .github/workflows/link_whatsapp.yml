name: Link WhatsApp

on:
  workflow_dispatch:

jobs:
  link-whatsapp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: github_actions
        run: npm install

      - name: Clean existing session (prevents 401 from stale keys)
        working-directory: github_actions
        run: rm -rf .baileys_auth

      - name: Generate QR Code (scan within 3 minutes)
        working-directory: github_actions
        timeout-minutes: 3
        run: |
          echo "A QR code will appear below. Scan it with WhatsApp (Linked Devices > Link a Device)."
          echo "You have 3 minutes."
          node whatsapp_sender.js link

      - name: Commit Saved Session
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f github_actions/.baileys_auth/
          git commit -m "Update WhatsApp Session keys (Baileys)" || echo "No changes to commit"
          git push
