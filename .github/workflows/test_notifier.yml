name: Test Canteen Notifier (Savya Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: github_actions
        run: pip install -r requirements.txt

      - name: Scrape Savya menu
        env:
          VIDYALAYA_USERNAME: ${{ secrets.VIDYALAYA_USERNAME }}
          VIDYALAYA_PASSWORD: ${{ secrets.VIDYALAYA_PASSWORD }}
          ENABLE_WHATSAPP: '1'
          SCRAPER_STRICT: '1'
        run: python github_actions/scraper.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Send menu to Savya group
        if: ${{ hashFiles('github_actions/message_to_send.txt') != '' }}
        working-directory: github_actions/wa_sender
        env:
          WA_SESSION_KEY: ${{ secrets.WA_SESSION_KEY }}
          WA_SESSION_ENC_PART001: ${{ secrets.WA_SESSION_ENC_PART001 }}
          WA_SESSION_ENC_PART002: ${{ secrets.WA_SESSION_ENC_PART002 }}
          WA_SESSION_ENC_PART003: ${{ secrets.WA_SESSION_ENC_PART003 }}
          WA_SESSION_ENC_PART004: ${{ secrets.WA_SESSION_ENC_PART004 }}
          WA_SESSION_ENC_PART005: ${{ secrets.WA_SESSION_ENC_PART005 }}
          WA_GROUP_JIDS: ${{ secrets.WA_GROUP_JID_SAVYA }}
        run: go run ./cmd/notifier send --session-enc /tmp/canteen-session.db.enc --message-file ../message_to_send.txt

      - name: Run sender unit tests
        working-directory: github_actions/wa_sender
        run: go test ./...
