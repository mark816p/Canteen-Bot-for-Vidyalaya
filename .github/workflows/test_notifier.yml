name: Test Canteen Notifier (Savya Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sender:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: github_actions/wa_sender/go.sum

      - name: Run sender unit tests
        working-directory: github_actions/wa_sender
        run: go test -mod=readonly ./...

  scrape:
    runs-on: ubuntu-latest
    outputs:
      has_message: ${{ steps.check_msg.outputs.has_message }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: github_actions
        run: pip install -r requirements.txt

      - name: Scrape Savya menu
        env:
          VIDYALAYA_USERNAME: ${{ secrets.VIDYALAYA_USERNAME }}
          VIDYALAYA_PASSWORD: ${{ secrets.VIDYALAYA_PASSWORD }}
          ENABLE_WHATSAPP: '1'
          SCRAPER_STRICT: '1'
        run: python github_actions/scraper.py

      - name: Check scraped message
        id: check_msg
        run: |
          if [ -s github_actions/message_to_send.txt ]; then
            echo "has_message=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_message=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload scraped message artifact
        if: steps.check_msg.outputs.has_message == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canteen-message-test
          path: github_actions/message_to_send.txt
          retention-days: 1

  notify:
    needs: [test-sender, scrape]
    if: needs.scrape.outputs.has_message == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: github_actions/wa_sender/go.sum

      - name: Download scraped message artifact
        uses: actions/download-artifact@v4
        with:
          name: canteen-message-test
          path: github_actions

      - name: Send menu to Savya group
        working-directory: github_actions/wa_sender
        env:
          WA_SESSION_KEY: ${{ secrets.WA_SESSION_KEY }}
          WA_SESSION_ENC_PART001: ${{ secrets.WA_SESSION_ENC_PART001 }}
          WA_SESSION_ENC_PART002: ${{ secrets.WA_SESSION_ENC_PART002 }}
          WA_SESSION_ENC_PART003: ${{ secrets.WA_SESSION_ENC_PART003 }}
          WA_SESSION_ENC_PART004: ${{ secrets.WA_SESSION_ENC_PART004 }}
          WA_SESSION_ENC_PART005: ${{ secrets.WA_SESSION_ENC_PART005 }}
          WA_GROUP_JIDS: ${{ secrets.WA_GROUP_JID_SAVYA }}
        run: go run -mod=readonly ./cmd/notifier send --session-enc /tmp/canteen-session.db.enc --message-file ../message_to_send.txt

      - name: Clean up temporary files
        if: always()
        run: rm -f /tmp/canteen-session.db.enc github_actions/message_to_send.txt
